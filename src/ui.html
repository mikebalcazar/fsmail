<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSMAIL</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#ffffff;--papel:#ffffff;--papel2:#f6f7f9;--borde:#e8eaef;--texto:#15171c;--tenue:#6b7280;--suave:#9aa1ad;
  --acento:#6c5ce7;--acento2:#8e7cff;--ok:#2ecc71;--aviso:#f5a623;--peligro:#ef5350;
  --vidrio:rgba(241,242,246,.82);--vidrio-borde:rgba(255,255,255,.95);--vidrio-texto:#15171c;--vidrio-tenue:#6b7280;
  --vidrio-sombra:0 30px 70px rgba(30,32,56,.16),0 10px 24px rgba(30,32,56,.07),0 1px 0 rgba(255,255,255,1) inset;
  --curva:cubic-bezier(.2,.8,.2,1);--curva-salida:cubic-bezier(.4,0,1,1);--rapido:.18s;--medio:.32s;--lento:.5s;
  --radio:18px;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--papel2);border:1px solid var(--borde);border-radius:12px;padding:9px 14px;cursor:pointer;transition:transform var(--rapido) var(--curva),background var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva),opacity var(--rapido)}
button:hover{background:#eef0f4}button:active{transform:scale(.96)}button:disabled{opacity:.5;cursor:default;transform:none}
button.primario{background:var(--acento);border-color:var(--acento);color:#fff;box-shadow:0 6px 18px rgba(108,92,231,.3)}button.primario:hover{background:var(--acento2)}
button.peligro{color:var(--peligro)}button.liso{background:transparent;border-color:transparent;color:var(--tenue)}button.liso:hover{background:var(--papel2);color:var(--texto)}
button.icono{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border-radius:10px}
input,textarea,select{font:inherit;color:inherit;background:var(--papel2);border:1px solid var(--borde);border-radius:12px;padding:10px 12px;width:100%;transition:border-color var(--rapido),box-shadow var(--rapido),background var(--rapido)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);box-shadow:0 0 0 4px rgba(108,92,231,.14);background:#fff}
textarea{min-height:140px;resize:vertical}label{display:block;font-size:12px;font-weight:600;color:var(--tenue);margin:10px 0 5px}
.oculto{display:none!important}
.error{color:var(--peligro);font-size:13px;min-height:18px;margin-top:8px}.pista{color:var(--tenue);font-size:13px}
.etq{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:#eef0f4;color:var(--tenue);white-space:nowrap}
.etq.morada{background:#efeaff;color:#5a48d6}.etq.verde{background:#e6f8ee;color:#1f8f4f}.etq.rosa{background:#ffe9ee;color:#c93a55}.etq.azul{background:#e7f0ff;color:#2b5bd7}.etq.ambar{background:#fff3df;color:#b26a00}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px;letter-spacing:.3px}
.punto{width:8px;height:8px;border-radius:50%;background:var(--acento);display:inline-block}

/* ─── entrada ─── */
#entrada{min-height:100%;display:grid;place-items:center;padding:16px}
.tarjeta{background:var(--vidrio);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--vidrio-borde);border-radius:22px;padding:30px;width:100%;max-width:420px;box-shadow:var(--vidrio-sombra);animation:aparece var(--lento) var(--curva) both;position:relative}
#entrada{position:relative}
.marca{font-weight:800;letter-spacing:4px;font-size:18px}.marca small{letter-spacing:0;font-weight:500;color:var(--tenue);margin-left:10px;font-size:13px}

/* ─── app ─── */
#app{height:100%;position:relative}
.marco{height:100%;display:grid;grid-template-columns:300px minmax(330px,420px) 1fr;animation:aparece var(--lento) var(--curva) both;background:transparent}
.columna{min-height:0;overflow:auto;position:relative}
/* barra izquierda: vidrio flotante, con sombra debajo */
#arbol{margin:14px 0 14px 14px;border-radius:24px;background:var(--vidrio);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--vidrio-borde);box-shadow:var(--vidrio-sombra);color:var(--vidrio-texto);display:flex;flex-direction:column;padding:16px 12px;gap:4px;background-image:linear-gradient(165deg,rgba(255,255,255,.7),rgba(255,255,255,0) 50%,rgba(255,255,255,.35));overflow:auto;scrollbar-width:thin}
.redactar-grande{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:16px;font-weight:700;font-size:15px;background:var(--acento);border-color:var(--acento);color:#fff;box-shadow:0 12px 26px rgba(108,92,231,.35);margin:4px 0 10px;letter-spacing:.2px}
.redactar-grande:hover{background:var(--acento2);transform:translateY(-1px);box-shadow:0 16px 30px rgba(108,92,231,.42)}.redactar-grande:active{transform:scale(.97)}.redactar-grande svg{width:20px;height:20px}
.cuenta{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}.cuenta .avatar{background:linear-gradient(135deg,var(--acento),#ff7ab6)}
.cuenta .n{font-weight:700;font-size:14px;line-height:1.1}.cuenta .c{font-size:11.5px;color:var(--vidrio-tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.cuenta .esp{flex:1}
.seccion{font-size:10.5px;letter-spacing:2px;color:var(--vidrio-tenue);padding:14px 10px 6px;text-transform:uppercase;font-weight:700}
.nodo{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;color:var(--vidrio-texto);user-select:none;position:relative;transition:background var(--rapido) var(--curva),transform var(--rapido) var(--curva),color var(--rapido)}
.nodo:hover{background:rgba(255,255,255,.75)}.nodo:active{transform:scale(.98)}
.nodo.activo{background:var(--acento);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.35)}
.nodo .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.nodo .c{font-size:11px;color:var(--vidrio-tenue);min-width:18px;text-align:center}
.nodo.activo .c{color:#fff}.nodo .c.sin{background:#fff;color:var(--acento);border-radius:999px;padding:1px 7px;font-weight:700}.nodo.activo .c.sin{background:#fff;color:var(--acento)}
.nodo .logo{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#fff;color:#222;font-weight:800;font-size:12px;overflow:hidden;flex:none;box-shadow:0 2px 6px rgba(20,20,40,.12)}
.nodo .logo img{width:100%;height:100%;object-fit:contain;padding:2px;background:#fff}
.nodo .flecha{width:16px;height:16px;transition:transform var(--medio) var(--curva);color:var(--vidrio-tenue)}.dom.abierto .flecha{transform:rotate(90deg)}
.nodo.dom{margin-top:2px;font-weight:600}.nodo.dom .estado{width:7px;height:7px;border-radius:50%;background:var(--aviso);flex:none}.nodo.dom .estado.verificado{background:var(--ok)}.nodo.dom .estado.fallido{background:var(--peligro)}
.hijos{overflow:hidden;height:0;opacity:0}.hijos.abierto{height:auto;opacity:1}
.nodo.dir{padding-left:34px;font-weight:400;font-size:13px}.nodo.dir .n i{color:var(--vidrio-tenue)}
.nodo.dom .engrane{width:26px;height:26px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--vidrio-tenue);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity var(--rapido) var(--curva),transform var(--rapido) var(--curva),background var(--rapido);flex:none;margin:-4px -2px -4px 0}
.nodo.dom:hover .engrane,.nodo.dom.activo .engrane{opacity:1;transform:none}.nodo.dom .engrane:hover{background:rgba(0,0,0,.08);color:var(--texto)}.nodo.dom.activo .engrane{color:#fff}.nodo.dom.activo .engrane:hover{background:rgba(255,255,255,.22)}
@media (hover:none){.nodo.dom .engrane{opacity:.7;transform:none}}
.pie-barra{margin-top:auto;padding:8px 4px 0;border-top:1px solid var(--vidrio-borde)}
.pie-barra .nodo{color:var(--vidrio-tenue)}
#btn-refrescar svg{transition:transform var(--medio) var(--curva)}#btn-refrescar.girando svg{animation:gira .8s linear infinite}
/* lista */
#lista{border-right:1px solid var(--borde);display:flex;flex-direction:column;background:var(--papel)}
.cabeza{padding:22px 18px 10px;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);z-index:2}
.cabeza h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}.cabeza h2 .etq{font-size:12px;padding:4px 10px}
.cabeza .sub{color:var(--tenue);font-size:12.5px;margin-top:2px}
.pestanas{display:flex;gap:4px;margin-top:12px;position:relative}
.pestanas button{border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--tenue);font-weight:600;font-size:13px}
.pestanas button.activo{color:var(--texto)}.pestanas button.activo::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:3px;border-radius:3px;background:var(--acento);animation:ancho var(--medio) var(--curva)}
.pestanas button{position:relative}
.buscar{margin-top:10px;position:relative}.buscar input{padding-left:36px;background:var(--papel2)}.buscar svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--suave)}
#filas{padding:6px 10px 20px;flex:1}
.fila{display:flex;gap:12px;padding:12px;border-radius:16px;cursor:pointer;animation:entra var(--medio) var(--curva) both;animation-delay:calc(var(--i,0)*28ms);transition:background var(--rapido) var(--curva),transform var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva);position:relative}
.fila:hover{background:var(--papel2)}.fila:active{transform:scale(.985)}
.fila.activo{background:#fff;box-shadow:0 14px 34px rgba(20,20,30,.12),0 0 0 1px var(--borde);transform:translateX(4px)}
.fila .acciones-fila{position:absolute;right:10px;top:10px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:opacity var(--rapido) var(--curva),transform var(--rapido) var(--curva)}
.fila:hover .acciones-fila{opacity:1;transform:none}.fila:hover .l1 .fecha{opacity:0}
.acciones-fila button{width:30px;height:30px;border-radius:9px;background:#fff;box-shadow:0 4px 12px rgba(20,20,30,.12)}.acciones-fila button svg{width:15px;height:15px}
.fila .cuerpo{flex:1;min-width:0}.fila .l1{display:flex;align-items:center;gap:8px}.fila .de{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.fila .fecha{font-size:11.5px;color:var(--suave);white-space:nowrap}.fila .asunto{font-size:13px;color:#3b3f48;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.fila .resumen{font-size:12.5px;color:var(--tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.fila .meta{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}.fila .meta .fecha{display:inline-flex;align-items:center;gap:4px}
.fila.nuevo .de{color:var(--texto)}.fila.nuevo::before{content:"";position:absolute;left:4px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--acento);transform:translateY(-50%)}
.fila .pal{color:var(--tenue);font-size:12px}
.vacio{display:grid;place-items:center;height:100%;min-height:200px;color:var(--suave);text-align:center;padding:30px;animation:aparece var(--medio) var(--curva) both}
/* lector */
#lector{display:flex;flex-direction:column;background:var(--papel)}
.lector-cab{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);z-index:2}
.lector-cab .esp{flex:1}.lector-cab .pos{font-size:12.5px;color:var(--tenue)}
.mensaje{padding:22px 26px;animation:entra var(--medio) var(--curva) both}
.remitente{display:flex;align-items:center;gap:12px}.remitente .avatar{width:44px;height:44px;font-size:16px}
.remitente .n{font-weight:700;font-size:15px}.remitente .m{font-size:12px;color:var(--tenue)}.remitente .m b{color:var(--texto);font-weight:600}
.remitente .fecha{margin-left:auto;font-size:12px;color:var(--tenue);text-align:right}
.mensaje h1{font-size:24px;font-weight:800;margin:18px 0 12px;letter-spacing:-.2px}
.auth{font-size:11.5px;color:var(--suave);margin-bottom:10px}.auth .mal{color:var(--peligro);font-weight:600}
.cuerpo-html iframe{width:100%;border:0;min-height:120px;background:#fff}.cuerpo-txt{white-space:pre-wrap;font-size:15px;line-height:1.6}
.adjuntos{margin-top:22px}.adjuntos h4{margin:0 0 10px;font-size:13px;color:var(--tenue);display:flex;align-items:center;gap:8px}.adjuntos h4 a{margin-left:auto;color:var(--acento);text-decoration:none;font-weight:600;font-size:12.5px}
.adjuntos .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.adj{background:var(--papel2);border:1px solid var(--borde);border-radius:14px;padding:12px;text-decoration:none;color:var(--texto);display:flex;flex-direction:column;gap:8px;transition:transform var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva);animation:entra var(--medio) var(--curva) both;animation-delay:calc(var(--i,0)*40ms)}
.adj:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,20,30,.12)}.adj .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#4f46e5}
.adj .nom{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adj .tam{font-size:11px;color:var(--suave)}
.responder{margin:22px 26px 26px;background:var(--papel2);border:1px solid var(--borde);border-radius:18px;padding:14px;animation:entra var(--medio) var(--curva) both}
.responder .para{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tenue);flex-wrap:wrap}.responder .para b{color:var(--texto)}
.responder textarea{margin-top:10px;background:#fff;min-height:110px}.responder .pie{display:flex;align-items:center;gap:8px;margin-top:10px}.responder .pie .esp{flex:1}
.acciones{display:flex;gap:4px;align-items:center}.acciones .sep{width:1px;height:22px;background:var(--borde);margin:0 4px}
.acciones button.icono svg{width:18px;height:18px}.acciones button.icono:hover{background:var(--papel2);color:var(--texto)}.acciones button.icono.peligro:hover{background:#ffe9ee;color:var(--peligro)}
/* adjuntar al redactar */
.adjuntar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.adjuntar button svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borde);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;animation:brota var(--rapido) var(--curva) both;max-width:100%}
.chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;font-weight:600}.chip .t{color:var(--suave)}.chip button{width:20px;height:20px;padding:0;border-radius:50%;border:0;background:var(--papel2);display:grid;place-items:center;font-size:12px;line-height:1}
/* diálogos */
.velo{position:fixed;inset:0;background:rgba(10,10,14,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:10;animation:aparece var(--rapido) var(--curva) both}
.dialogo{background:var(--papel);border-radius:22px;padding:24px;width:100%;max-width:680px;max-height:92vh;overflow:auto;box-shadow:0 40px 100px rgba(0,0,0,.45);animation:brota var(--medio) var(--curva) both}
.dialogo h3{margin:0 0 12px;font-size:18px;font-weight:800}.dialogo .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
table.dns{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}table.dns th,table.dns td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--borde);vertical-align:top;word-break:break-all}
table.dns th{color:var(--tenue);font-weight:600}table.dns td code{background:var(--papel2);padding:2px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.est{font-size:12px;font-weight:600}.est.verified,.est.verificado{color:var(--ok)}.est.pending,.est.not_started,.est.pendiente{color:var(--aviso)}.est.failed,.est.fallido{color:var(--peligro)}
.lista-dirs .d{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--borde)}.lista-dirs .d .n{flex:1}
.marca-grid{display:grid;grid-template-columns:1fr 1fr 110px;gap:8px;align-items:end}.firma-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logo-actual{display:flex;align-items:center;gap:12px;margin-top:8px}.logo-actual img{max-height:48px;max-width:140px;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--borde)}
.previa{margin-top:10px;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px;min-height:60px}.previa iframe{width:100%;border:0;height:150px;background:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#15171c;color:#fff;border-radius:12px;padding:11px 16px;font-size:13.5px;z-index:20;opacity:0;transition:opacity var(--medio) var(--curva),transform var(--medio) var(--curva);pointer-events:none}
#toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
#volver{display:none}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes brota{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
@keyframes ancho{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
@keyframes gira{to{transform:rotate(360deg)}}
@media (max-width:1000px){
  .marco{grid-template-columns:1fr}#arbol{margin:10px;border-radius:20px}
  .marco[data-vista="arbol"] #lista,.marco[data-vista="arbol"] #lector{display:none}
  .marco[data-vista="lista"] #arbol,.marco[data-vista="lista"] #lector{display:none}
  .marco[data-vista="lector"] #arbol,.marco[data-vista="lector"] #lista{display:none}
  #volver{display:inline-grid}#menu{display:inline-grid!important}.marca-grid,.firma-grid{grid-template-columns:1fr}
  .fila .acciones-fila{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="entrada">
  <div class="tarjeta">
    <div class="marca">FSMAIL <small>correo para tus dominios</small></div>
    <div id="paso-usuario">
      <label>Usuario o correo</label>
      <input id="in-usuario" autocomplete="username" autocapitalize="none" placeholder="tu-usuario">
      <div class="error" id="err-usuario"></div>
      <button class="primario" id="btn-codigo" style="width:100%">Mandarme un código</button>
      <p class="pista">¿Sin cuenta? <a href="#" id="ir-registro" style="color:var(--acento);font-weight:600">Crear una</a></p>
    </div>
    <div id="paso-registro" class="oculto">
      <label>Usuario</label><input id="reg-usuario" autocapitalize="none" placeholder="minúsculas, números, . _ -">
      <label>Correo (para entrar y recuperar)</label><input id="reg-correo" type="email" autocomplete="email" placeholder="tu@correo.com">
      <label>Nombre (opcional)</label><input id="reg-nombre" autocomplete="name">
      <div class="error" id="err-registro"></div>
      <button class="primario" id="btn-registro" style="width:100%">Crear cuenta</button>
      <p class="pista"><a href="#" id="ir-entrar" style="color:var(--acento);font-weight:600">Ya tengo cuenta</a></p>
    </div>
    <div id="paso-codigo" class="oculto">
      <p class="pista" id="pista-codigo"></p>
      <label>Código de 6 dígitos</label>
      <input id="in-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:8px;text-align:center">
      <div class="error" id="err-codigo"></div>
      <button class="primario" id="btn-entrar" style="width:100%">Entrar</button>
      <p class="pista"><a href="#" id="otra-vez" style="color:var(--acento);font-weight:600">Pedir otro código</a></p>
    </div>
  </div>
</div>

<div id="app" class="oculto">
  <div class="marco" data-vista="arbol">
    <nav class="columna" id="arbol"></nav>
    <section class="columna" id="lista">
      <div class="cabeza">
        <div style="display:flex;align-items:center;gap:8px"><button class="icono liso" id="menu" title="Bandejas" style="display:none">☰</button><h2 id="titulo" style="flex:1">Bandeja</h2><button class="icono liso" id="btn-refrescar" title="Refrescar"></button></div>
        <div class="sub" id="subtitulo"></div>
        <div class="pestanas" id="pestanas"></div>
        <div class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="buscar" placeholder="Buscar en esta bandeja"></div>
      </div>
      <div id="filas"></div>

  </div>
</div>

<div id="dialogos"></div>
<div id="toast"></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (ruta, cuerpo, metodo) => {
  const r = await fetch('/api' + ruta, { method: metodo || (cuerpo ? 'POST' : 'GET'), headers: cuerpo ? { 'Content-Type': 'application/json' } : {}, body: cuerpo ? JSON.stringify(cuerpo) : undefined, credentials: 'same-origin' });
  let j = {}; try { j = await r.json(); } catch {}

};
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('ver'), 2600); };
const fecha = (iso) => { const d = new Date(iso); const hoy = new Date(); const mismo = d.toDateString() === hoy.toDateString(); return mismo ? d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) + (d.getFullYear() !== hoy.getFullYear() ? ' ' + d.getFullYear() : ''); };
const diaTexto = (iso) => { const d = new Date(iso); const hoy = new Date(); const ayer = new Date(Date.now() - 864e5); if (d.toDateString() === hoy.toDateString()) return 'Hoy'; if (d.toDateString() === ayer.toDateString()) return 'Ayer'; return d.toLocaleDateString('es-MX', { weekday: 'long' }); };
const COLORES = ['#6c5ce7', '#00b894', '#e17055', '#0984e3', '#d63384', '#f39c12', '#16a085', '#8e44ad'];
const colorDe = (s) => { let h = 0; for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORES[h % COLORES.length]; };
const inicial = (s) => (String(s || '?').trim()[0] || '?').toUpperCase();
const MENSAJES_ERROR = { username_invalido: 'Usuario inválido: de 3 a 32, minúsculas, números, punto, guion o guion bajo.', correo_invalido: 'Ese correo no se ve bien.', username_ocupado: 'Ese usuario ya existe.', correo_ocupado: 'Ese correo ya tiene cuenta.', codigo_invalido: 'Código incorrecto o vencido.', espera_para_reenviar: 'Espera medio minuto antes de pedir otro.', dominio_invalido: 'Eso no parece un dominio (ej. negocio.com).', dominio_ya_agregado: 'Ese dominio ya está en tu cuenta.', dominio_de_otra_cuenta: 'Ese dominio ya lo administra otra cuenta.', correo_no_configurado: 'El cartero no está configurado todavía.', cartero_fallo: 'El cartero contestó con error.', direccion_invalida: 'Dirección inválida.', direccion_ya_existe: 'Esa dirección ya existe.', dominio_sin_verificar: 'Primero verifica el dominio (registros DNS).', destinatario_invalido: 'Revisa los destinatarios.', mensaje_vacio: 'Escribe algo.', dominio_con_correo: 'El dominio tiene correo guardado; no se puede quitar.', sitio_invalido: 'El sitio no se ve como una dirección web.', color_invalido: 'El color va como #rrggbb.', logo_tipo_invalido: 'El logo debe ser PNG, JPG, GIF o WebP.', logo_tamano_invalido: 'El logo pesa más de 512 KB.', adjuntos_demasiados: 'Máximo 10 adjuntos por correo.', adjuntos_pesados: 'Los adjuntos pesan más de 20 MB en total.', adjunto_invalido: 'Un adjunto no se pudo leer.' };

const ICONO = { flecha: '<svg class="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>', atras: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg>', clip: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 11.5-8.5 8.5a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>', bandeja: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>', ojo: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/></svg>', ajustes: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.4 3h-4l-.4 2.6a7 7 0 0 0-1.7 1L6 5.6l-2 3.4L6 10.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6z"/></svg>', mas: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>', salir: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l5-5-5-5M15 12H3M21 3v18"/></svg>', redactar: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',

const CURVA = 'cubic-bezier(.2,.8,.2,1)', CURVA_SALIDA = 'cubic-bezier(.4,0,1,1)';

/** Despliega o recoge los hijos de un dominio: de arriba hacia abajo, rápido, con aceleración. */
function desplegar(el, abrir) {
  if (!el) return;
  if (sinMovimiento()) { el.classList.toggle('abierto', abrir); return; }

    el.classList.add('abierto'); const h = el.scrollHeight;
    el.animate([{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 260, easing: CURVA });
    el.querySelectorAll('.nodo').forEach((n, i) => n.animate([{ opacity: 0, transform: 'translateY(-12px)' }, { opacity: 1, transform: 'none' }], { duration: 220, delay: 40 + i * 32, easing: CURVA, fill: 'backwards' }));

    const h = el.scrollHeight;

// ─── estado ───
const E = { cuenta: null, dominios: [], conteos: [], filtro: { modo: 'todo', dominio: null, direccion: null }, carpeta: 'entrada', q: '', mensajes: [], abierto: null, usuarioPendiente: '', abiertos: new Set() };
const CARPETAS = [['entrada', 'Entrada'], ['enviados', 'Enviados'], ['archivo', 'Archivo'], ['basura', 'Basura']];

// ─── entrada ───
function mostrarEntrada() { $('#app').classList.add('oculto'); $('#entrada').classList.remove('oculto'); }
function pasoEntrada(p) { for (const x of ['usuario', 'registro', 'codigo']) $('#paso-' + x).classList.toggle('oculto', x !== p); }
$('#ir-registro').onclick = (e) => { e.preventDefault(); pasoEntrada('registro'); };
$('#ir-entrar').onclick = (e) => { e.preventDefault(); pasoEntrada('usuario'); };
$('#otra-vez').onclick = (e) => { e.preventDefault(); pasoEntrada('usuario'); };
async function pedirCodigo(usuario) {
  const j = await api('/auth/codigo', { usuario });
  if (j.estado === 429) { $('#err-usuario').textContent = errorDe(j); return; }
  E.usuarioPendiente = usuario;
  $('#pista-codigo').textContent = j.correo_pista ? 'Te mandamos un código a ' + j.correo_pista + (j.enviado ? '.' : '. (Correo apagado en este entorno' + (j.codigo_prueba ? ': ' + j.codigo_prueba : '') + ')') : 'Si esa cuenta existe, le llegó un código.';
  pasoEntrada('codigo'); $('#in-codigo').value = ''; $('#in-codigo').focus();
}
$('#btn-codigo').onclick = () => { const u = $('#in-usuario').value.trim().toLowerCase(); $('#err-usuario').textContent = ''; if (!u) return ($('#err-usuario').textContent = 'Escribe tu usuario o correo.'); pedirCodigo(u); };
$('#in-usuario').onkeydown = (e) => { if (e.key === 'Enter') $('#btn-codigo').click(); };
$('#btn-registro').onclick = async () => {
  $('#err-registro').textContent = '';
  const j = await api('/auth/registro', { username: $('#reg-usuario').value.trim().toLowerCase(), correo: $('#reg-correo').value.trim(), nombre: $('#reg-nombre').value.trim() });
  if (!j.ok) return ($('#err-registro').textContent = errorDe(j));
  E.usuarioPendiente = $('#reg-usuario').value.trim().toLowerCase();
  $('#pista-codigo').textContent = 'Cuenta creada. Código enviado a ' + j.correo_pista + (j.enviado ? '.' : '. (Correo apagado en este entorno' + (j.codigo_prueba ? ': ' + j.codigo_prueba : '') + ')');
  pasoEntrada('codigo'); $('#in-codigo').focus();
};
$('#btn-entrar').onclick = async () => {
  $('#err-codigo').textContent = '';
  const j = await api('/auth/entrar', { usuario: E.usuarioPendiente, codigo: $('#in-codigo').value });
  if (!j.ok) return ($('#err-codigo').textContent = errorDe(j) + (j.intentos_restantes != null ? ' Te quedan ' + j.intentos_restantes + '.' : ''));
  arrancar(j.cuenta);
};
$('#in-codigo').onkeydown = (e) => { if (e.key === 'Enter') $('#btn-entrar').click(); };

// ─── app ───
async function arrancar(cuenta) {
  E.cuenta = cuenta;
  $('#entrada').classList.add('oculto'); $('#app').classList.remove('oculto');
  await cargarArbol(); await cargarLista();
}
async function cargarArbol() {
  const [d, c] = await Promise.all([api('/dominios'), api('/mensajes/conteos')]);
  E.dominios = d.dominios || []; E.conteos = c.conteos || [];
  if (E.abiertos.size === 0 && E.dominios.length) E.abiertos.add(E.dominios[0].id);

}
const conteo = (dominio_id, direccion_id) => { let t = 0, s = 0; for (const x of E.conteos) { if (dominio_id && x.dominio_id !== dominio_id) continue; if (direccion_id !== undefined && (x.direccion_id || null) !== direccion_id) continue; t += x.total; s += x.sin_leer; } return { t, s }; };
const marcaNombre = (d) => d.marca?.nombre || d.dominio;
function logoHtml(d) { return d.marca?.logo ? `<span class="logo"><img src="/marca/${d.id}/logo" alt=""></span>` : `<span class="logo" style="background:${d.marca?.color || colorDe(d.dominio)};color:#fff">${esc(inicial(marcaNombre(d)))}</span>`; }
function pintarArbol(anim = {}) {
  const a = $('#arbol'); const f = E.filtro; const cu = E.cuenta || {};
  const badge = (c) => c ? `<span class="c${c.s ? ' sin' : ''}">${c.s ? c.s : (c.t || '')}</span>` : '';

  h += `<button class="redactar-grande" id="btn-redactar">${ICONO.redactar}<span>Redactar</span></button>`;
  h += `<div class="nodo${f.modo === 'todo' ? ' activo' : ''}" data-modo="todo">${ICONO.bandeja}<span class="n">Todas las bandejas</span>${badge(conteo(null))}</div>`;
  h += `<div class="nodo${f.modo === 'sinleer' ? ' activo' : ''}" data-modo="sinleer">${ICONO.ojo}<span class="n">Sin leer</span>${badge({ t: 0, s: conteo(null).s })}</div>`;
  h += `<div class="seccion">Dominios</div>`;
  for (const d of E.dominios) {

    for (const x of d.direcciones) h += `<div class="nodo dir${f.modo === 'dom' && f.dominio === d.id && f.direccion === x.id ? ' activo' : ''}" data-dom="${d.id}" data-dir="${x.id}"><span class="n">${esc(x.local)}@</span>${badge(conteo(d.id, x.id))}</div>`;
    const sin = conteo(d.id, null); if (sin.t) h += `<div class="nodo dir${f.modo === 'dom' && f.dominio === d.id && f.direccion === 'ninguna' ? ' activo' : ''}" data-dom="${d.id}" data-dir="ninguna"><span class="n"><i>sin dirección</i></span>${badge(sin)}</div>`;
    if (!d.direcciones.length && !sin.t) h += `<div class="nodo" data-config="${d.id}" style="padding-left:34px;font-size:12.5px;color:var(--vidrio-tenue)"><span class="n"><i>sin direcciones aún · configurar</i></span></div>`;
    h += `</div>`;

  h += `<div class="nodo" id="agregar-dominio" style="color:var(--acento2)">${ICONO.mas}<span class="n">Agregar dominio</span></div>`;
  if (!E.dominios.length) h += `<p class="pista" style="padding:4px 10px;color:var(--vidrio-tenue)">Agrega el dominio de tu negocio y te damos los registros DNS para recibir y enviar.</p>`;
  h += `<div class="pie-barra"><div class="nodo" id="btn-salir">${ICONO.salir}<span class="n">Salir</span></div></div>`;

    E.filtro = { modo: 'dom', dominio: id, direccion: null }; pintarArbol(cerrar ? { cerrar: id } : estaba ? {} : { abrir: id }); cargarLista(); if (window.innerWidth <= 1000 && yaActivo) vista('lista');
  });
  a.querySelectorAll('.nodo.dir').forEach((n) => n.onclick = (e) => { e.stopPropagation(); E.filtro = { modo: 'dom', dominio: n.dataset.dom, direccion: n.dataset.dir }; pintarArbol(); cargarLista(); vista('lista'); });
  a.querySelectorAll('[data-config]').forEach((n) => n.onclick = (e) => { e.stopPropagation(); dialogoDominio(n.dataset.config); });
  $('#agregar-dominio').onclick = dialogoAgregarDominio;
  $('#btn-redactar').onclick = () => dialogoRedactar({ direccion_id: E.filtro.direccion && E.filtro.direccion !== 'ninguna' ? E.filtro.direccion : undefined });
  $('#btn-salir').onclick = async () => { await api('/auth/salir', {}); location.reload(); };
}
function vista(v) { $('.marco').dataset.vista = v; }
function pintarCabeza() {
  const f = E.filtro; let titulo = 'Todas las bandejas', sub = `${E.dominios.length} dominio${E.dominios.length === 1 ? '' : 's'} · ${conteo(null).s} sin leer`;
  if (f.modo === 'sinleer') { titulo = 'Sin leer'; sub = 'Todo lo que no has abierto, de todos los dominios'; }
  if (f.modo === 'dom') { const d = E.dominios.find((x) => x.id === f.dominio); if (d) { const x = d.direcciones.find((y) => y.id === f.direccion); titulo = x ? `${x.local}@${d.dominio}` : f.direccion === 'ninguna' ? `${d.dominio} · sin dirección` : d.dominio; const c = x ? conteo(d.id, x.id) : f.direccion === 'ninguna' ? conteo(d.id, null) : conteo(d.id); sub = `${marcaNombre(d)} · ${c.s} sin leer de ${c.t}`; } }
  $('#titulo').innerHTML = `${esc(titulo)}${conteoActual() ? ` <span class="etq morada">${conteoActual()}</span>` : ''}`; $('#subtitulo').textContent = sub;
  const p = $('#pestanas'); p.innerHTML = f.modo === 'sinleer' ? '' : CARPETAS.map(([k, n]) => `<button class="${E.carpeta === k ? 'activo' : ''}" data-carpeta="${k}">${n}</button>`).join('');
  p.querySelectorAll('button').forEach((b) => b.onclick = () => { E.carpeta = b.dataset.carpeta; pintarCabeza(); cargarLista(); });
}
const conteoActual = () => { const f = E.filtro; if (f.modo === 'sinleer') return conteo(null).s; if (f.modo === 'todo') return conteo(null).s; const x = f.direccion && f.direccion !== 'ninguna' ? conteo(f.dominio, f.direccion) : f.direccion === 'ninguna' ? conteo(f.dominio, null) : conteo(f.dominio); return x.s; };
$('#menu').onclick = () => vista('arbol');
$('#btn-refrescar').innerHTML = ICONO.refrescar;
async function refrescar(silencioso) {
  const b = $('#btn-refrescar'); b.classList.add('girando');
  const antes = conteo(null).s;
  try { await cargarArbol(); await cargarLista(); } finally { setTimeout(() => b.classList.remove('girando'), 400); }
  if (!silencioso) { const ahora = conteo(null).s; toast(ahora > antes ? `${ahora - antes} nuevo${ahora - antes === 1 ? '' : 's'}` : 'Al día'); }
}
$('#btn-refrescar').onclick = () => refrescar(false);
setInterval(() => { if (document.visibilityState === 'visible' && E.cuenta && !document.querySelector('.velo')) refrescar(true); }, 60000);
let tBuscar; $('#buscar').oninput = () => { clearTimeout(tBuscar); tBuscar = setTimeout(() => { E.q = $('#buscar').value.trim(); cargarLista(); }, 280); };
async function cargarLista() {

// ─── adjuntar archivos al redactar ───
const MAX_ADJ = 10, MAX_ADJ_BYTES = 20 * 1024 * 1024;
const kbTexto = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
function adjuntador(cont, errEl) {
  if (!cont) return { leer: async () => [], vaciar() {} };
  let archivos = [];
  cont.innerHTML = `<div class="adjuntar"><input type="file" multiple style="display:none"><button class="liso" type="button">${ICONO.adjuntar} Adjuntar</button><span class="pista"></span></div><div class="chips"></div>`;
  const input = $('input', cont), boton = $('button', cont), pista = $('.pista', cont), chips = $('.chips', cont);
  const pintar = () => {
    const total = archivos.reduce((s, f) => s + f.size, 0);
    pista.textContent = archivos.length ? `${archivos.length} archivo${archivos.length === 1 ? '' : 's'} · ${kbTexto(total)}` : '';
    chips.innerHTML = archivos.map((f, i) => `<span class="chip" title="${esc(f.name)}"><span class="n">${esc(f.name)}</span><span class="t">${kbTexto(f.size)}</span><button type="button" data-q="${i}" title="Quitar">×</button></span>`).join('');
    chips.querySelectorAll('button').forEach((b) => b.onclick = () => { archivos.splice(Number(b.dataset.q), 1); pintar(); });
  };
  boton.onclick = () => input.click();
  input.onchange = () => {
    const nuevos = [...input.files]; input.value = '';
    const todos = [...archivos, ...nuevos];
    if (todos.length > MAX_ADJ) { if (errEl) errEl.textContent = MENSAJES_ERROR.adjuntos_demasiados; return; }
    if (todos.reduce((s, f) => s + f.size, 0) > MAX_ADJ_BYTES) { if (errEl) errEl.textContent = MENSAJES_ERROR.adjuntos_pesados; return; }
    if (errEl) errEl.textContent = ''; archivos = todos; pintar();
  };
  const base64 = (f) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).replace(/^data:[^,]*,/, '')); r.onerror = mal; r.readAsDataURL(f); });
  return {
    async leer() { const out = []; for (const f of archivos) out.push({ nombre: f.name, tipo: f.type || 'application/octet-stream', contenido: await base64(f) }); return out; },
    vaciar() { archivos = []; pintar(); },
  };
}

  let tPrevia; const previa = () => { clearTimeout(tPrevia); tPrevia = setTimeout(async () => { const j = await api('/dominios/' + id + '/firma-previa', { local: $('#dir-local', v).value, firma: firmaForm(), marca: marcaForm() }); const f = $('#dir-previa', v); if (f) f.srcdoc = j.hay ? '<body style="margin:0;padding:8px;background:#fff">' + j.html + '</body>' : '<body style="margin:0;padding:8px;font:13px sans-serif;color:#6b7280">Llena nombre, puesto o teléfono y aquí aparece el banner.</body>'; }, 250); };
  ['#dir-local', '#dir-nombre', '#dir-puesto', '#dir-tel', '#marca-nombre', '#marca-sitio', '#marca-color'].forEach((sel) => $(sel, v).oninput = previa); previa();
  $('#marca-ok', v).onclick = async () => { $('#marca-msg', v).textContent = 'Guardando…'; const j = await api('/dominios/' + id, { marca: marcaForm() }, 'PATCH'); $('#marca-msg', v).textContent = j.ok ? 'Marca guardada' : errorDe(j); if (j.ok) await cargarArbol(); };
  $('#logo-subir', v).onclick = (e) => { e.preventDefault(); $('#logo-archivo', v).click(); };
  $('#logo-archivo', v).onchange = async () => { const f = $('#logo-archivo', v).files[0]; if (!f) return; const r = await fetch('/api/dominios/' + id + '/logo', { method: 'PUT', headers: { 'Content-Type': f.type }, body: f, credentials: 'same-origin' }); const j = await r.json(); if (!j.ok) return toast(errorDe(j)); await cargarArbol(); v.remove(); dialogoDominio(id); toast('Logo subido'); };
  if ($('#logo-quitar', v)) $('#logo-quitar', v).onclick = async () => { await api('/dominios/' + id + '/logo', undefined, 'DELETE'); await cargarArbol(); v.remove(); dialogoDominio(id); };
  $('#dir-ok', v).onclick = async () => { const j = await api('/dominios/' + id + '/direcciones', { local: $('#dir-local', v).value, nombre: $('#dir-nombre', v).value, firma: firmaForm() }); if (!j.ok) return ($('#dir-err', v).textContent = errorDe(j)); await cargarArbol(); v.remove(); dialogoDominio(id); toast('Dirección creada con su firma'); };
  v.querySelectorAll('[data-tog]').forEach((b) => b.onclick = async () => { await api('/dominios/' + id + '/direcciones/' + b.dataset.tog, { activa: b.dataset.act === '1' }, 'PATCH'); await cargarArbol(); v.remove(); dialogoDominio(id); });
  v.querySelectorAll('[data-firma]').forEach((b) => b.onclick = () => { v.remove(); dialogoFirma(id, b.dataset.firma); });
  $('#dom-quitar', v).onclick = async () => { if (!confirm('¿Quitar ' + d.dominio + ' de tu cuenta? El correo dejará de llegar aquí.')) return; const j = await api('/dominios/' + id, undefined, 'DELETE'); if (!j.ok) return toast(errorDe(j)); v.remove(); E.filtro = { modo: 'todo', dominio: null, direccion: null }; await cargarArbol(); await cargarLista(); };
}
function dialogoFirma(dominio_id, direccion_id) {
  const d = E.dominios.find((x) => x.id === dominio_id); const x = d && d.direcciones.find((y) => y.id === direccion_id); if (!x) return;
  const f = x.firma || {};
  const v = dialogo(`<h3>Firma de ${esc(x.correo)}</h3>
    <div class="firma-grid"><div><label>Nombre</label><input id="f-nombre" value="${esc(f.nombre || x.nombre || '')}"></div><div><label>Puesto</label><input id="f-puesto" value="${esc(f.puesto || '')}"></div><div><label>Teléfono (con lada; 10 dígitos = México)</label><input id="f-tel" value="${esc(f.telefono || '')}" inputmode="tel"></div><div><label>Renglón extra (opcional)</label><input id="f-extra" value="${esc(f.extra || '')}" placeholder="Horario, dirección…"></div></div>
    <p class="pista">El logo, el sitio y el color salen de la marca del dominio. Ligas: logo → sitio, nombre → correo, teléfono → WhatsApp.</p>
    <div class="previa"><iframe id="f-previa" sandbox="" title="vista previa"></iframe></div>
    <div class="error" id="f-err"></div>
    <div class="pie"><button class="liso" id="f-cancelar">Cancelar</button><button class="primario" id="f-ok">Guardar firma</button></div>`);
  const form = () => ({ nombre: $('#f-nombre', v).value, puesto: $('#f-puesto', v).value, telefono: $('#f-tel', v).value, extra: $('#f-extra', v).value });
  let t; const previa = () => { clearTimeout(t); t = setTimeout(async () => { const j = await api('/dominios/' + dominio_id + '/firma-previa', { local: x.local, firma: form() }); const fr = $('#f-previa', v); if (fr) fr.srcdoc = '<body style="margin:0;padding:8px;background:#fff">' + (j.html || '<span style="font:13px sans-serif;color:#6b7280">Sin datos, sin firma.</span>') + '</body>'; }, 250); };
  ['#f-nombre', '#f-puesto', '#f-tel', '#f-extra'].forEach((sel) => $(sel, v).oninput = previa); previa();
  $('#f-cancelar', v).onclick = () => { v.remove(); dialogoDominio(dominio_id); };
  $('#f-ok', v).onclick = async () => { const j = await api('/dominios/' + dominio_id + '/direcciones/' + direccion_id, { firma: form(), nombre: $('#f-nombre', v).value }, 'PATCH'); if (!j.ok) return ($('#f-err', v).textContent = errorDe(j)); await cargarArbol(); v.remove(); toast('Firma guardada'); dialogoDominio(dominio_id); };
}
function dialogoRedactar(pre = {}) {
  const opciones = []; for (const d of E.dominios) for (const x of d.direcciones) if (x.activa) opciones.push({ id: x.id, correo: x.local + '@' + d.dominio, ok: d.estado === 'verificado', firma: !!(x.firma && (x.firma.nombre || x.firma.puesto || x.firma.telefono)) });
  if (!opciones.length) return toast('Primero agrega un dominio y una dirección.');
  const v = dialogo(`<h3>Nuevo mensaje</h3>
    <label>Desde</label><select id="r-de">${opciones.map((o) => `<option value="${o.id}" ${o.id === pre.direccion_id ? 'selected' : ''} ${o.ok ? '' : 'disabled'}>${esc(o.correo)}${o.ok ? '' : ' (dominio sin verificar)'}</option>`).join('')}</select>
    <label>Para</label><input id="r-para" value="${esc(pre.para || '')}" placeholder="cliente@correo.com, otro@correo.com">
    <label>Asunto</label><input id="r-asunto" value="${esc(pre.asunto || '')}">
    <label>Mensaje</label><textarea id="r-texto"></textarea>
    <div id="r-adjuntos2"></div>
    <p class="pista" id="r-firma2"></p>
    <div class="error" id="r-err2"></div>
    <div class="pie"><button class="liso" id="r-cancelar">Cancelar</button><button class="primario" id="r-enviar2">Enviar</button></div>`);
  $('#r-cancelar', v).onclick = () => v.remove(); $('#r-para', v).focus();
  const adj = adjuntador($('#r-adjuntos2', v), $('#r-err2', v));
  const avisoFirma = () => { const o = opciones.find((z) => z.id === $('#r-de', v).value); $('#r-firma2', v).textContent = o && o.firma ? 'Sale con la firma de ' + o.correo + '.' : 'Esta dirección no tiene firma (se agrega en el dominio → Firma).'; };
  $('#r-de', v).onchange = avisoFirma; avisoFirma();
  $('#r-enviar2', v).onclick = async () => {
    $('#r-enviar2', v).disabled = true; $('#r-err2', v).textContent = '';
    const adjuntos = await adj.leer();
    const j = await api('/mensajes/enviar', { direccion_id: $('#r-de', v).value, para: $('#r-para', v).value, asunto: $('#r-asunto', v).value, texto: $('#r-texto', v).value, ...(adjuntos.length ? { adjuntos } : {}) });
    $('#r-enviar2', v).disabled = false;
    if (!j.ok) return ($('#r-err2', v).textContent = errorDe(j) + (j.detalle ? ' ' + j.detalle : ''));
    v.remove(); toast('Enviado'); if (E.carpeta === 'enviados') cargarLista();
  };
}

addEventListener('message', (e) => { const d = e.data; if (d && d.fsmail === 'alto' && E.alturaDe) E.alturaDe(d.id, d.alto); });

// ─── arranque ───
api('/yo').then((j) => { if (j.ok) arrancar(j.cuenta); else mostrarEntrada(); });
})();
</script>
</body>
</html>
